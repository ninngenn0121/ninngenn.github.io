<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムチャット</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; height: 100vh; background: #f0f2f5; }
    
    /* ログインモーダル */
    #login-screen {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .login-box { background: white; padding: 30px; border-radius: 8px; text-align: center; width: 320px; }
    .login-box input { padding: 10px; width: 100%; margin: 8px 0; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; }
    .login-box button { padding: 10px; width: 100%; font-size: 16px; cursor: pointer; background: #0084ff; color: white; border: none; border-radius: 4px; margin-top: 10px; }
    .toggle-auth { margin-top: 15px; font-size: 13px; color: #0084ff; cursor: pointer; text-decoration: underline; }

    #sidebar { width: 270px; background: #2f3136; color: white; padding: 15px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
    #main-chat { flex: 1; display: flex; flex-direction: column; background: white; }
    
    h3 { font-size: 12px; text-transform: uppercase; color: #8e9297; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    ul { list-style: none; }
    li { 
      padding: 8px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; color: #dcddde; 
      display: flex; justify-content: space-between; align-items: center; font-size: 13px;
    }
    li:hover, li.active { background: #393c43; color: white; }
    
    .user-info { display: flex; flex-direction: column; overflow: hidden; }
    .user-name { font-weight: 500; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .last-seen { font-size: 10px; color: #96989d; }

    .badge {
      background-color: #f23f43; color: white; font-size: 11px; font-weight: bold;
      padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; display: inline-block;
    }

    .admin-btn { background: #d9480f; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-bottom: 6px; width: 100%; text-align: left; }
    .admin-btn:hover { background: #c2255c; }

    #chat-header { padding: 15px; border-bottom: 1px solid #e3e5e8; font-weight: bold; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
    #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .message { 
      padding: 8px 12px; background: #e4e6eb; border-radius: 8px; max-width: 70%; word-break: break-all; 
      position: relative; display: flex; flex-direction: column;
    }
    .message.my-msg { background: #0084ff; color: white; align-self: flex-end; }
    .message .sender { font-size: 12px; opacity: 0.7; margin-bottom: 2px; }
    .message .text { font-size: 15px; }

    .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 4px; }
    .msg-time { font-size: 10px; opacity: 0.45; }
    .edited-mark { font-size: 10px; opacity: 0.45; }

    .action-btn {
      background: none; border: none; color: inherit; opacity: 0.5; font-size: 11px;
      cursor: pointer; text-decoration: underline; padding: 0; display: none;
    }
    .message:hover .action-btn { display: inline; }
    .action-btn:hover { opacity: 1; }

    #form { padding: 15px; border-top: 1px solid #e3e5e8; display: flex; gap: 10px; }
    #input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 16px; }
    #form button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; }

    /* モーダル用共通スタイル */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 200; }
    .modal-box { background: white; padding: 20px; border-radius: 8px; max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto; color: #333; }
    .modal-box h3 { color: #111; font-size: 16px; margin-bottom: 12px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    .btn-danger { background: #e03131; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-success { background: #2f9e44; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

  <!-- 認証モーダル -->
  <div id="login-screen">
    <div class="login-box">
      <h2 id="auth-title">ログイン</h2>
      <input type="text" id="auth-username" placeholder="ユーザー名">
      <input type="password" id="auth-password" placeholder="パスワード">
      <button id="auth-btn" onclick="submitAuth()">ログイン</button>
      <div class="toggle-auth" id="toggle-auth-btn" onclick="toggleAuthMode()">アカウントをお持ちでない方（新規登録）</div>
    </div>
  </div>

  <!-- パスワード一覧モーダル -->
  <div id="pass-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>🔑 ユーザー・パスワード一覧</h3>
      <div id="pass-list"></div>
      <button onclick="closeModal('pass-modal')" style="margin-top: 15px; padding: 6px 12px; cursor: pointer;">閉じる</button>
    </div>
  </div>

  <!-- DM監視一覧モーダル -->
  <div id="dm-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>🔍 全DM（ダイレクトメッセージ）一覧</h3>
      <div id="dm-list"></div>
      <button onclick="closeModal('dm-modal')" style="margin-top: 15px; padding: 6px 12px; cursor: pointer;">閉じる</button>
    </div>
  </div>

  <!-- BAN管理モーダル -->
  <div id="ban-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>🚫 ユーザーBAN（アカウント停止）管理</h3>
      <div id="ban-list"></div>
      <button onclick="closeModal('ban-modal')" style="margin-top: 15px; padding: 6px 12px; cursor: pointer;">閉じる</button>
    </div>
  </div>

  <!-- サイドバー -->
  <div id="sidebar">
    <div>
      <h3>チャンネル</h3>
      <ul>
        <li id="room-general" class="active" onclick="switchRoom('general')">
          <span># general</span>
          <span class="badge" id="badge-general" style="display: none;">0</span>
        </li>
        <li id="room-random" onclick="switchRoom('random')">
          <span># random</span>
          <span class="badge" id="badge-random" style="display: none;">0</span>
        </li>
      </ul>
    </div>

    <div>
      <h3>🟢 オンラインユーザー</h3>
      <ul id="online-user-list"></ul>
    </div>

    <div>
      <h3>⚪ オフラインユーザー</h3>
      <ul id="offline-user-list"></ul>
    </div>

    <!-- 開発者専用エリア -->
    <div id="admin-panel" style="display: none; border-top: 1px solid #4f545c; padding-top: 10px;">
      <h3 style="color: #ff8787;">🛡️ 開発者メニュー</h3>
      <button class="admin-btn" onclick="fetchUserPasswords()">🔑 パスワード一覧表示</button>
      <button class="admin-btn" onclick="fetchDMList()">🔍 DMの閲覧・監視</button>
      <button class="admin-btn" onclick="openBanManager()">🚫 BAN（ユーザー停止）管理</button>
    </div>
  </div>

  <!-- メインエリア -->
  <div id="main-chat">
    <div id="chat-header">
      <span id="chat-title"># general</span>
      <button id="clear-channel-btn" class="admin-btn" style="display: none; width: auto; background: #e03131;" onclick="clearCurrentChannel()">⚠️ チャンネル投稿全削除</button>
    </div>
    <div id="messages"></div>
    <form id="form" onsubmit="sendMessage(event)">
      <input id="input" autocomplete="off" placeholder="メッセージを入力..." />
      <button>送信</button>
    </form>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io(window.location.origin);
    
    let myUsername = "";
    let isAdminUser = false;
    let isRegisterMode = false;
    let currentRoom = "general";
    
    let messageHistory = {};
    const unreadCounts = {};
    let latestUserList = {};
    let cachedUsersObj = {};
    let cachedBannedList = [];

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').textContent = isRegisterMode ? "新規アカウント登録" : "ログイン";
      document.getElementById('auth-btn').textContent = isRegisterMode ? "登録して開始" : "ログイン";
      document.getElementById('toggle-auth-btn').textContent = isRegisterMode ? "すでに登録済みの方（ログイン）" : "アカウントをお持ちでない方（新規登録）";
    }

    function submitAuth() {
      const u = document.getElementById('auth-username').value.trim();
      const p = document.getElementById('auth-password').value.trim();
      if (!u || !p) return alert("ユーザー名とパスワードの両方を入力してください");

      if (isRegisterMode) {
        socket.emit('register account', { username: u, password: p });
      } else {
        socket.emit('login account', { username: u, password: p });
      }
    }

    socket.on('auth error', (msg) => { alert(msg); });

    socket.on('banned notification', (msg) => {
      alert(msg);
      window.location.reload();
    });

    socket.on('auth success', (data) => {
      myUsername = data.username;
      isAdminUser = data.isAdmin;

      document.getElementById('login-screen').style.display = 'none';

      if (isAdminUser) {
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('clear-channel-btn').style.display = 'block';
      }

      socket.emit('register user', myUsername);
    });

    socket.on('load history', (history) => {
      messageHistory = history;
      renderMessages();
    });

    function switchRoom(targetRoom) {
      currentRoom = targetRoom;
      socket.emit('join room', currentRoom);

      if (!messageHistory[currentRoom]) {
        messageHistory[currentRoom] = [];
      }

      unreadCounts[currentRoom] = 0;
      updateBadgeUI(currentRoom);

      const headerTitle = document.getElementById('chat-title');
      if (targetRoom.includes("_DM_")) {
        const usersInDM = targetRoom.split("_DM_");
        headerTitle.textContent = `💬 DM: ${usersInDM.join(" ↔ ")}`;
      } else {
        headerTitle.textContent = `# ${targetRoom}`;
      }

      document.querySelectorAll('#sidebar li').forEach(li => li.classList.remove('active'));
      const activeEl = document.getElementById(`room-${targetRoom}`);
      if (activeEl) activeEl.classList.add('active');

      renderMessages();
    }

    function startDM(targetUser) {
      if (targetUser === myUsername) return;
      const dmRoomName = [myUsername, targetUser].sort().join("_DM_");
      switchRoom(dmRoomName);
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('chat message', {
        text: text,
        targetRoom: currentRoom
      });

      input.value = '';
    }

    function editMessage(msgId, currentText) {
      const newText = prompt("メッセージを編集:", currentText);
      if (newText !== null && newText.trim() !== "" && newText !== currentText) {
        socket.emit('edit message', { id: msgId, newText: newText.trim(), targetRoom: currentRoom });
      }
    }

    function deleteMessage(msgId) {
      if (confirm("このメッセージを削除しますか？")) {
        socket.emit('delete message', { id: msgId, targetRoom: currentRoom });
      }
    }

    function clearCurrentChannel() {
      if (confirm(`本当にチャンネル [${currentRoom}] の投稿をすべて削除しますか？`)) {
        socket.emit('clear channel', currentRoom);
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    /* パスワード一覧 */
    function fetchUserPasswords() {
      socket.emit('get admin user list');
    }

    socket.on('admin user list result', (data) => {
      cachedUsersObj = data.users;
      cachedBannedList = data.banned;
      
      const listDiv = document.getElementById('pass-list');
      listDiv.innerHTML = '';
      for (const [u, p] of Object.entries(cachedUsersObj)) {
        const isBanned = cachedBannedList.includes(u);
        listDiv.innerHTML += `
          <div class="list-item">
            <div><strong>${escapeHtml(u)}</strong> ${isBanned ? '<span style="color:red;">(BAN済み)</span>' : ''}</div>
            <div style="font-family: monospace; background:#f1f3f5; padding:2px 6px; border-radius:3px;">${escapeHtml(p)}</div>
          </div>`;
      }
      document.getElementById('pass-modal').style.display = 'flex';
    });

    /* DM閲覧・監視 */
    function fetchDMList() {
      socket.emit('get admin dm list');
    }

    socket.on('admin dm list result', (dmRooms) => {
      const listDiv = document.getElementById('dm-list');
      listDiv.innerHTML = '';
      if (dmRooms.length === 0) {
        listDiv.innerHTML = '<div style="padding: 10px; color: #888;">現在進行中のDMはありません。</div>';
      } else {
        dmRooms.forEach(room => {
          listDiv.innerHTML += `
            <div class="list-item">
              <div>
                <strong>💬 ${escapeHtml(room.members.join(' ↔ '))}</strong>
                <div style="font-size: 11px; color: #666;">送信件数: ${room.msgCount}件</div>
              </div>
              <button class="btn-success" onclick="observeDM('${room.roomName}')">監視・開く</button>
            </div>`;
        });
      }
      document.getElementById('dm-modal').style.display = 'flex';
    });

    function observeDM(roomName) {
      closeModal('dm-modal');
      socket.emit('admin observe dm', roomName);
      switchRoom(roomName);
    }

    /* BAN管理 */
    function openBanManager() {
      socket.emit('get admin user list'); // 最新情報を取得
      setTimeout(() => {
        renderBanManagerUI();
        document.getElementById('ban-modal').style.display = 'flex';
      }, 200);
    }

    function renderBanManagerUI() {
      const listDiv = document.getElementById('ban-list');
      listDiv.innerHTML = '';

      for (const u of Object.keys(cachedUsersObj)) {
        if (u === 'アルパカ') continue; // 自分は表示しない
        const isBanned = cachedBannedList.includes(u);
        listDiv.innerHTML += `
          <div class="list-item">
            <div>
              <strong>${escapeHtml(u)}</strong>
              ${isBanned ? '<span style="color:red; font-size:12px; margin-left:8px;">[停止中]</span>' : ''}
            </div>
            ${isBanned ? `
              <button class="btn-success" onclick="unbanUser('${escapeHtml(u)}')">BAN解除</button>
            ` : `
              <button class="btn-danger" onclick="banUser('${escapeHtml(u)}')">BAN（アカウント停止）</button>
            `}
          </div>`;
      }
    }

    function banUser(targetUser) {
      if (confirm(`本当に [${targetUser}] をBANしますか？\n（オンラインの場合は即座に切断されます）`)) {
        socket.emit('admin ban user', targetUser);
      }
    }

    function unbanUser(targetUser) {
      if (confirm(`[${targetUser}] のBANを解除しますか？`)) {
        socket.emit('admin unban user', targetUser);
      }
    }

    socket.on('admin ban success', (data) => {
      alert(`ユーザー [${data.username}] を${data.isBanned ? 'BAN' : 'BAN解除'}しました。`);
      closeModal('ban-modal');
    });

    socket.on('chat message', (data) => {
      const room = data.targetRoom;
      if (!messageHistory[room]) messageHistory[room] = [];
      messageHistory[room].push(data);

      if (room === currentRoom) {
        renderMessages();
      } else {
        unreadCounts[room] = (unreadCounts[room] || 0) + 1;
        updateBadgeUI(room);
      }
    });

    socket.on('edit message', (data) => {
      const room = data.targetRoom;
      if (messageHistory[room]) {
        const msg = messageHistory[room].find(m => m.id === data.id);
        if (msg) {
          msg.text = data.newText;
          msg.isEdited = true;
        }
      }
      if (room === currentRoom) renderMessages();
    });

    socket.on('delete message', (data) => {
      const room = data.targetRoom;
      if (messageHistory[room]) {
        messageHistory[room] = messageHistory[room].filter(m => m.id !== data.id);
      }
      if (room === currentRoom) renderMessages();
    });

    socket.on('clear channel', (roomName) => {
      messageHistory[roomName] = [];
      if (currentRoom === roomName) renderMessages();
    });

    function updateBadgeUI(room) {
      const badgeEl = document.getElementById(`badge-${room}`);
      if (!badgeEl) return;
      const count = unreadCounts[room] || 0;
      if (count > 0) {
        badgeEl.textContent = count;
        badgeEl.style.display = 'inline-block';
      } else {
        badgeEl.style.display = 'none';
      }
    }

    function renderMessages() {
      const messagesContainer = document.getElementById('messages');
      messagesContainer.innerHTML = '';

      const history = messageHistory[currentRoom] || [];
      history.forEach(msg => {
        const div = document.createElement('div');
        const isMe = (msg.user === myUsername);
        div.className = `message ${isMe ? 'my-msg' : ''}`;
        
        const canManage = isMe || isAdminUser;

        div.innerHTML = `
          <div class="sender">${isMe ? 'あなた' : escapeHtml(msg.user)}</div>
          <div class="text">${escapeHtml(msg.text)}</div>
          <div class="msg-footer">
            ${canManage ? `
              <button class="action-btn" onclick="editMessage('${msg.id}', '${escapeHtml(msg.text)}')">編集</button>
              <button class="action-btn" onclick="deleteMessage('${msg.id}')">削除</button>
            ` : ''}
            ${msg.isEdited ? '<span class="edited-mark">(編集済み)</span>' : ''}
            <span class="msg-time">${msg.time || ''}</span>
          </div>
        `;
        messagesContainer.appendChild(div);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function formatLastSeen(lastSeenTimestamp) {
      if (!lastSeenTimestamp) return 'オフライン';
      const now = Date.now();
      const diffMs = now - lastSeenTimestamp;
      const diffMinutes = Math.floor(diffMs / (1000 * 60));

      if (diffMinutes < 1) {
        return 'たった今オフライン';
      } else if (diffMinutes < 60) {
        return `${diffMinutes}分前`;
      } else {
        const diffHours = Math.floor(diffMinutes / 60);
        if (diffHours < 24) {
          return `${diffHours}時間前`;
        } else {
          const diffDays = Math.floor(diffHours / 24);
          return `${diffDays}日前`;
        }
      }
    }

    socket.on('update user list', (users) => {
      latestUserList = users;
      renderUserLists();
    });

    function renderUserLists() {
      const onlineList = document.getElementById('online-user-list');
      const offlineList = document.getElementById('offline-user-list');
      
      onlineList.innerHTML = '';
      offlineList.innerHTML = '';

      for (const [username, info] of Object.entries(latestUserList)) {
        if (username === myUsername) continue;

        const dmRoomName = [myUsername, username].sort().join("_DM_");
        const li = document.createElement('li');
        li.id = `room-${dmRoomName}`;
        li.onclick = () => startDM(username);

        const infoDiv = document.createElement('div');
        infoDiv.className = 'user-info';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'user-name';
        nameSpan.textContent = username;
        infoDiv.appendChild(nameSpan);

        if (!info.isOnline) {
          const timeSpan = document.createElement('span');
          timeSpan.className = 'last-seen';
          timeSpan.textContent = formatLastSeen(info.lastSeen);
          infoDiv.appendChild(timeSpan);
        }

        const badgeSpan = document.createElement('span');
        badgeSpan.className = 'badge';
        badgeSpan.id = `badge-${dmRoomName}`;
        
        const count = unreadCounts[dmRoomName] || 0;
        badgeSpan.textContent = count;
        if (count === 0) badgeSpan.style.display = 'none';

        li.appendChild(infoDiv);
        li.appendChild(badgeSpan);

        if (currentRoom === dmRoomName) {
          li.classList.add('active');
        }

        if (info.isOnline) {
          onlineList.appendChild(li);
        } else {
          offlineList.appendChild(li);
        }
      }
    }

    setInterval(() => {
      if (Object.keys(latestUserList).length > 0) {
        renderUserLists();
      }
    }, 60000);

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
