<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムチャット</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; height: 100vh; background: #f0f2f5; }
    
    /* ログイン画面 */
    #login-screen {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .login-box { background: white; padding: 30px; border-radius: 8px; text-align: center; }
    .login-box input { padding: 10px; width: 80%; margin: 10px 0; font-size: 16px; }
    .login-box button { padding: 10px 20px; font-size: 16px; cursor: pointer; }

    /* メインレイアウト */
    #sidebar { width: 260px; background: #2f3136; color: white; padding: 15px; display: flex; flex-direction: column; gap: 20px; }
    #main-chat { flex: 1; display: flex; flex-direction: column; background: white; }
    
    h3 { font-size: 14px; text-transform: uppercase; color: #8e9297; margin-bottom: 8px; }
    ul { list-style: none; }
    li { 
      padding: 8px 12px; 
      border-radius: 4px; 
      cursor: pointer; 
      margin-bottom: 4px; 
      color: #dcddde; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    li:hover, li.active { background: #393c43; color: white; }
    
    /* 未読通知バッジのスタイル */
    .badge {
      background-color: #f23f43;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
      display: inline-block;
    }

    /* チャットエリア */
    #chat-header { padding: 15px; border-bottom: 1px solid #e3e5e8; font-weight: bold; font-size: 18px; }
    #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 8px 12px; background: #e4e6eb; border-radius: 8px; max-width: 70%; word-break: break-all; }
    .message.my-msg { background: #0084ff; color: white; align-self: flex-end; }
    .message .sender { font-size: 12px; opacity: 0.7; margin-bottom: 2px; }

    /* 送信フォーム */
    #form { padding: 15px; border-top: 1px solid #e3e5e8; display: flex; gap: 10px; }
    #input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 16px; }
    #form button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

  <!-- ログインモーダル -->
  <div id="login-screen">
    <div class="login-box">
      <h2>チャットに参加</h2>
      <input type="text" id="username-input" placeholder="名前を入力してください">
      <br>
      <button onclick="login()">開始</button>
    </div>
  </div>

  <!-- サイドバー -->
  <div id="sidebar">
    <div>
      <h3>チャンネル</h3>
      <ul>
        <li id="room-general" class="active" onclick="switchRoom('general')">
          <span># general</span>
          <span class="badge" id="badge-general" style="display: none;">0</span>
        </li>
        <li id="room-random" onclick="switchRoom('random')">
          <span># random</span>
          <span class="badge" id="badge-random" style="display: none;">0</span>
        </li>
      </ul>
    </div>
    <div>
      <h3>オンラインユーザー (DM)</h3>
      <ul id="user-list"></ul>
    </div>
  </div>

  <!-- チャットメインエリア -->
  <div id="main-chat">
    <div id="chat-header"># general</div>
    <div id="messages"></div>
    <form id="form" onsubmit="sendMessage(event)">
      <input id="input" autocomplete="off" placeholder="メッセージを入力..." />
      <button>送信</button>
    </form>
  </div>

  <!-- Socket.ioライブラリ -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io(window.location.origin);
    
    let myUsername = "";
    let currentRoom = "general";
    
    // 部屋ごとの会話履歴
    const messageHistory = { "general": [], "random": [] };
    
    // 部屋ごとの未読件数を管理するデータ { "general": 0, "DM_xxx": 2 }
    const unreadCounts = {};

    // ログイン処理
    function login() {
      const input = document.getElementById('username-input');
      const name = input.value.trim();
      if (!name) return alert("名前を入力してください");

      myUsername = name;
      document.getElementById('login-screen').style.display = 'none';

      socket.emit('register user', myUsername);
      socket.emit('join room', 'general');
    }

    // 部屋切り替え処理
    function switchRoom(targetRoom) {
      currentRoom = targetRoom;
      socket.emit('join room', currentRoom);

      if (!messageHistory[currentRoom]) {
        messageHistory[currentRoom] = [];
      }

      // 🌟 開いた部屋の未読カウントをリセット（0にして消す）
      unreadCounts[currentRoom] = 0;
      updateBadgeUI(currentRoom);

      // ヘッダー表示の更新
      const header = document.getElementById('chat-header');
      if (targetRoom.includes("_DM_")) {
        const usersInDM = targetRoom.split("_DM_");
        const otherUser = usersInDM.find(u => u !== myUsername);
        header.textContent = `💬 ${otherUser} とのDM`;
      } else {
        header.textContent = `# ${targetRoom}`;
      }

      // アクティブ表示の切り替え
      document.querySelectorAll('#sidebar li').forEach(li => li.classList.remove('active'));
      const activeEl = document.getElementById(`room-${targetRoom}`);
      if (activeEl) activeEl.classList.add('active');

      renderMessages();
    }

    // DMを開始する部屋名を計算
    function startDM(targetUser) {
      if (targetUser === myUsername) return;
      const dmRoomName = [myUsername, targetUser].sort().join("_DM_");
      switchRoom(dmRoomName);
    }

    // メッセージ送信
    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('chat message', {
        text: text,
        targetRoom: currentRoom
      });

      input.value = '';
    }

    // サーバーからメッセージを受信したとき
    socket.on('chat message', (data) => {
      const room = data.targetRoom;

      // 履歴がなければ作成して保存（開いていなくても裏で保存される）
      if (!messageHistory[room]) {
        messageHistory[room] = [];
      }
      messageHistory[room].push(data);

      if (room === currentRoom) {
        // 今見ている部屋なら画面を更新
        renderMessages();
      } else {
        // 🌟 見ていない部屋なら未読カウントを＋1してバッジを更新！
        unreadCounts[room] = (unreadCounts[room] || 0) + 1;
        updateBadgeUI(room);
      }
    });

    // バッジ（数字）の表示を更新する関数
    function updateBadgeUI(room) {
      const badgeEl = document.getElementById(`badge-${room}`);
      if (!badgeEl) return;

      const count = unreadCounts[room] || 0;
      if (count > 0) {
        badgeEl.textContent = count;
        badgeEl.style.display = 'inline-block'; // 表示
      } else {
        badgeEl.style.display = 'none'; // 0件なら隠す
      }
    }

    // メッセージ描画
    function renderMessages() {
      const messagesContainer = document.getElementById('messages');
      messagesContainer.innerHTML = '';

      const history = messageHistory[currentRoom] || [];
      history.forEach(msg => {
        const div = document.createElement('div');
        const isMe = (msg.user === myUsername);
        div.className = `message ${isMe ? 'my-msg' : ''}`;
        
        div.innerHTML = `
          <div class="sender">${isMe ? 'あなた' : msg.user}</div>
          <div class="text">${escapeHtml(msg.text)}</div>
        `;
        messagesContainer.appendChild(div);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // オンラインユーザーリストの更新
    socket.on('update user list', (users) => {
      const userList = document.getElementById('user-list');
      userList.innerHTML = '';

      Object.values(users).forEach(username => {
        if (username === myUsername) return;

        const dmRoomName = [myUsername, username].sort().join("_DM_");
        const li = document.createElement('li');
        li.id = `room-${dmRoomName}`;
        li.onclick = () => startDM(username);

        // 名前のテキスト部分
        const nameSpan = document.createElement('span');
        nameSpan.textContent = `👤 ${username}`;

        // 未読バッジ部分
        const badgeSpan = document.createElement('span');
        badgeSpan.className = 'badge';
        badgeSpan.id = `badge-${dmRoomName}`;
        
        const count = unreadCounts[dmRoomName] || 0;
        badgeSpan.textContent = count;
        if (count === 0) badgeSpan.style.display = 'none';

        li.appendChild(nameSpan);
        li.appendChild(badgeSpan);

        if (currentRoom === dmRoomName) {
          li.classList.add('active');
        }
        userList.appendChild(li);
      });
    });

    // エスケープ処理
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
