<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f2f5; color: #333; height: 100vh; display: flex; }
        
        /* ログイン・登録モーダル */
        #auth-container { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-box { background: white; padding: 30px; border-radius: 12px; width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .auth-box h2 { margin-bottom: 20px; font-size: 20px; text-align: center; }
        .auth-box input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; }
        .auth-box button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 8px; }
        .auth-box button.secondary { background: #6c757d; }

        /* アプリレイアウト */
        #app { display: flex; width: 100%; height: 100vh; overflow: hidden; }
        
        /* サイドバー */
        #sidebar { width: 280px; background: #2f3136; color: #dcddde; display: flex; flex-direction: column; border-right: 1px solid #202225; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #202225; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-section { padding: 10px; overflow-y: auto; flex: 1; }
        .genre-title { font-size: 12px; font-weight: bold; color: #8e9297; text-transform: uppercase; margin: 12px 0 6px 0; display: flex; justify-content: space-between; align-items: center; }
        .channel-item, .user-item { padding: 8px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
        .channel-item:hover, .user-item:hover { background: #393c43; }
        .channel-item.active, .user-item.active { background: #4f545c; color: white; }
        .badge { background: #f23f43; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

        /* メインチャットエリア */
        #main-chat { flex: 1; display: flex; flex-direction: column; background: #ffffff; }
        .chat-header { height: 50px; border-bottom: 1px solid #e3e5e8; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #f8f9fa; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        /* メッセージコンポーネント */
        .message { display: flex; gap: 12px; align-items: flex-start; position: relative; padding: 4px 8px; border-radius: 6px; }
        .message:hover { background: #f8f9fa; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #ccc; }
        .msg-body { flex: 1; }
        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .msg-author { font-weight: bold; font-size: 14px; }
        .msg-time { font-size: 11px; color: #a3a6aa; }
        .msg-reply-preview { font-size: 12px; color: #6c757d; background: #e9ecef; padding: 4px 8px; border-radius: 4px; margin-bottom: 4px; border-left: 3px solid #007bff; }
        .msg-text { font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
        .msg-media img, .msg-media video { max-width: 300px; max-height: 200px; border-radius: 8px; margin-top: 6px; }
        .msg-actions { display: none; position: absolute; right: 10px; top: 4px; background: white; border: 1px solid #ccc; border-radius: 4px; padding: 2px; }
        .message:hover .msg-actions { display: flex; gap: 4px; }
        .msg-actions button { background: none; border: none; cursor: pointer; font-size: 12px; padding: 2px 6px; }
        .pin-badge { font-size: 11px; color: #ffc107; font-weight: bold; margin-left: 6px; }

        /* 入力エリア */
        .chat-input-area { padding: 15px; border-top: 1px solid #e3e5e8; background: #fff; display: flex; flex-direction: column; gap: 8px; }
        #reply-bar { display: none; background: #e9ecef; padding: 6px 12px; border-radius: 4px; font-size: 12px; justify-content: space-between; align-items: center; }
        .input-controls { display: flex; gap: 8px; align-items: center; }
        .input-controls textarea { flex: 1; height: 40px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; resize: none; font-family: inherit; }
        .input-controls button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* リアクション */
        .reactions-bar { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
        .reaction-btn { background: #f0f2f5; border: 1px solid #dcdfe6; border-radius: 12px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
        .reaction-btn.active { background: #e6f2ff; border-color: #007bff; }

        /* 共通モーダル */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 380px; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 12px; }
        .modal-content input, .modal-content select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .modal-content button { padding: 8px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 6px; }
        .modal-content button.close { background: #6c757d; }
    </style>
</head>
<body>

    <!-- 認証画面（ログイン／新規登録） -->
    <div id="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">ログイン</h2>
            <input type="text" id="auth-username" placeholder="ユーザー名">
            <input type="password" id="auth-password" placeholder="パスワード">
            <button id="auth-submit-btn" onclick="submitAuth()">ログイン</button>
            <button class="secondary" onclick="toggleAuthMode()">新規会員登録へ切り替え</button>
            <p id="auth-error" style="color: red; font-size: 12px; margin-top: 8px; text-align: center;"></p>
        </div>
    </div>

    <!-- アプリメインUI -->
    <div id="app">
        <!-- サイドバー -->
        <div id="sidebar">
            <div class="sidebar-header">
                <span id="current-user-display">ユーザー名</span>
                <button onclick="openProfileModal()" style="font-size: 11px; padding: 4px 8px;">設定</button>
            </div>

            <div class="sidebar-section">
                <!-- チャンネル一覧 ＆ ジャンル -->
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 12px; font-weight: bold;">チャンネル</span>
                    <div>
                        <button onclick="openCreateChannelModal()" style="font-size: 10px;">+ 部屋</button>
                        <button id="btn-manage-genres" onclick="openGenreManageModal()" style="font-size: 10px; display: none;">ジャンル編集</button>
                    </div>
                </div>
                <div id="genres-container"></div>

                <!-- DM一覧 -->
                <div class="genre-title" style="margin-top: 20px;">
                    <span>ダイレクトメッセージ</span>
                </div>
                <div id="dm-list-container"></div>

                <!-- ユーザー一覧（プロフィール閲覧・DM開始用） -->
                <div class="genre-title" style="margin-top: 20px;">
                    <span>オンラインユーザー</span>
                </div>
                <div id="user-list-container"></div>

                <!-- 管理者メニュー（管理者のみ表示） -->
                <div id="admin-panel" style="display: none; margin-top: 20px; border-top: 1px solid #444; padding-top: 10px;">
                    <div class="genre-title" style="color: #ffc107;">管理者メニュー</div>
                    <button onclick="fetchAdminPasswords()" style="width: 100%; font-size: 11px; margin-bottom: 4px;">パスワード閲覧</button>
                    <button onclick="fetchAdminDms()" style="width: 100%; font-size: 11px;">全DM閲覧</button>
                </div>
            </div>
        </div>

        <!-- メインチャットエリア -->
        <div id="main-chat">
            <div class="chat-header">
                <div>
                    <span id="room-title"># 雑談</span>
                    <button id="btn-channel-notif" onclick="toggleChannelNotification()" style="font-size: 11px; margin-left: 10px;">通知: ON</button>
                </div>
                <div id="key-room-controls" style="display: none;">
                    <button onclick="openKeyRoomManageModal()" style="font-size: 11px;">鍵部屋メンバー管理</button>
                </div>
            </div>

            <!-- メッセージリスト -->
            <div class="chat-messages" id="chat-messages"></div>

            <!-- 入力バー -->
            <div class="chat-input-area">
                <div id="reply-bar">
                    <span id="reply-preview-text">〜への返信</span>
                    <button onclick="cancelReply()" style="background: none; border: none; cursor: pointer; font-weight: bold;">✕</button>
                </div>
                <div class="input-controls">
                    <textarea id="msg-input" placeholder="メッセージを入力..."></textarea>
                    <input type="file" id="media-input" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect(this)">
                    <button onclick="document.getElementById('media-input').click()" style="background: #6c757d;">📷</button>
                    <button onclick="sendMessage()">送信</button>
                </div>
                <span id="selected-file-name" style="font-size: 11px; color: #6c757d;"></span>
            </div>
        </div>
    </div>

    <!-- プロフィール設定モーダル -->
    <div id="modal-profile" class="modal">
        <div class="modal-content">
            <h3>プロフィール ＆ 通知設定</h3>
            <label style="font-size: 12px;">アイコン画像URL/Base64</label>
            <input type="text" id="prof-icon" placeholder="https://example.com/icon.png">
            <label style="font-size: 12px;">ステータス</label>
            <input type="text" id="prof-status" placeholder="例: 離席中">
            <label style="font-size: 12px;">自己紹介</label>
            <input type="text" id="prof-bio" placeholder="自己紹介">
            <div style="margin: 10px 0;">
                <label><input type="checkbox" id="prof-notifications" checked> アプリ全体通知を有効にする</label>
            </div>
            <button onclick="saveProfile()">保存</button>
            <button class="close" onclick="closeModal('modal-profile')">閉じる</button>
        </div>
    </div>

    <!-- ユーザープロフィール閲覧＆DM開始モーダル -->
    <div id="modal-user-view" class="modal">
        <div class="modal-content">
            <h3 id="view-username">ユーザー名</h3>
            <img id="view-icon" src="" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 10px;">
            <p id="view-status" style="font-size: 12px; font-weight: bold; color: #007bff;"></p>
            <p id="view-bio" style="font-size: 13px; margin: 10px 0;"></p>
            <div id="admin-user-actions" style="display: none; border-top: 1px solid #ccc; padding-top: 10px; margin-top: 10px;">
                <p style="font-size: 11px; font-weight: bold; color: red;">管理者操作</p>
                <button id="btn-ip-ban" onclick="toggleIpBan()" style="background: #dc3545; font-size: 11px;">IPBAN切り替え</button>
                <button id="btn-grant-genre" onclick="grantGenrePermission()" style="background: #ffc107; color: black; font-size: 11px;">ジャンル管理権限付与</button>
            </div>
            <br>
            <button onclick="startDmWithUser()">DMを開始する</button>
            <button class="close" onclick="closeModal('modal-user-view')">閉じる</button>
        </div>
    </div>

    <!-- チャンネル作成モーダル -->
    <div id="modal-create-channel" class="modal">
        <div class="modal-content">
            <h3>チャンネル作成</h3>
            <input type="text" id="new-channel-name" placeholder="チャンネル名">
            <label style="font-size: 12px;">ジャンル</label>
            <select id="new-channel-genre"></select>
            <div>
                <label><input type="checkbox" id="new-channel-key" onchange="toggleKeyPasswordInput(this)"> 鍵部屋にする</label>
            </div>
            <input type="password" id="new-channel-pass" placeholder="鍵部屋のパスワード" style="display: none; margin-top: 8px;">
            <br>
            <button onclick="createChannel()">作成</button>
            <button class="close" onclick="closeModal('modal-create-channel')">閉じる</button>
        </div>
    </div>

    <!-- 鍵部屋メンバー管理モーダル -->
    <div id="modal-key-room-manage" class="modal">
        <div class="modal-content">
            <h3>鍵部屋メンバー管理</h3>
            <input type="text" id="target-key-user" placeholder="対象のユーザー名">
            <button onclick="manageKeyRoomUser('add')">追加</button>
            <button onclick="manageKeyRoomUser('remove')" style="background: #dc3545;">追放</button>
            <button class="close" onclick="closeModal('modal-key-room-manage')" style="margin-top: 10px;">閉じる</button>
        </div>
    </div>

    <!-- ジャンル管理モーダル -->
    <div id="modal-genre-manage" class="modal">
        <div class="modal-content">
            <h3>ジャンルの管理・並び替え</h3>
            <input type="text" id="new-genre-input" placeholder="新しいジャンル名">
            <button onclick="addGenre()">追加</button>
            <hr style="margin: 15px 0;">
            <div id="genre-edit-list"></div>
            <br>
            <button class="close" onclick="closeModal('modal-genre-manage')">閉じる</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let currentRoom = '雑談';
        let isAuthLogin = true;
        let selectedFileBase64 = null;
        let selectedFileType = null;
        let activeReplyTo = null;
        let activeTargetUser = null;
        let channelsData = [];
        let genresData = [];
        let unreadCounts = {};

        // --- 認証系 ---
        function toggleAuthMode() {
            isAuthLogin = !isAuthLogin;
            document.getElementById('auth-title').innerText = isAuthLogin ? 'ログイン' : '新規会員登録';
            document.getElementById('auth-submit-btn').innerText = isAuthLogin ? 'ログイン' : '新規登録';
        }

        function submitAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            if (!username || !password) return alert('ユーザー名とパスワードを入力してください');

            if (isAuthLogin) {
                socket.emit('login', { username, password });
            } else {
                socket.emit('register', { username, password });
            }
        }

        socket.on('login_result', handleAuthResult);
        socket.on('register_result', handleAuthResult);

        function handleAuthResult(res) {
            if (res.success) {
                currentUser = res.user;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('current-user-display').innerText = currentUser.username;
                if (currentUser.isAdmin) {
                    document.getElementById('admin-panel').style.display = 'block';
                }
                joinRoom(currentRoom);
            } else {
                document.getElementById('auth-error').innerText = res.message;
            }
        }

        // --- 部屋・DM参加 ---
        function joinRoom(roomName, password = '') {
            currentRoom = roomName;
            document.getElementById('room-title').innerText = roomName.startsWith('dm_') ? `@ ${roomName.replace('dm_', '')}` : `# ${roomName}`;
            document.getElementById('chat-messages').innerHTML = '';
            
            // 鍵部屋作成者チェック
            const channel = channelsData.find(c => c.name === roomName);
            if (channel && channel.isKey && (channel.creator === currentUser.username || currentUser.isAdmin)) {
                document.getElementById('key-room-controls').style.display = 'block';
            } else {
                document.getElementById('key-room-controls').style.display = 'none';
            }

            // 通知ボタン状態表示
            updateNotificationButtonState();

            socket.emit('join_room', { room: roomName, password });
        }

        socket.on('load_history', (messages) => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
            container.scrollTop = container.scrollHeight;
        });

        // --- メッセージ受信＆投稿 ---
        socket.on('chat_message', (msg) => {
            if (msg.room === currentRoom) {
                appendMessage(msg);
                const container = document.getElementById('chat-messages');
                container.scrollTop = container.scrollHeight;
            }
        });

        function appendMessage(msg) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'message';
            div.id = `msg-${msg.id}`;

            const iconUrl = msg.userIcon || 'https://via.placeholder.com/40';
            const pinSpan = msg.isPinned ? `<span class="pin-badge">📌 ピン留め中</span>` : '';

            let replyHtml = '';
            if (msg.replyTo) {
                replyHtml = `<div class="msg-reply-preview">返信先 @${msg.replyTo.user}: ${msg.replyTo.text}</div>`;
            }

            let mediaHtml = '';
            if (msg.media) {
                if (msg.mediaType === 'image') mediaHtml = `<div class="msg-media"><img src="${msg.media}"></div>`;
                else if (msg.mediaType === 'video') mediaHtml = `<div class="msg-media"><video src="${msg.media}" controls></video></div>`;
            }

            // リアクション表示
            let reactionsHtml = '<div class="reactions-bar">';
            if (msg.reactions) {
                for (const [emoji, users] of Object.entries(msg.reactions)) {
                    reactionsHtml += `<button class="reaction-btn ${users.includes(currentUser.username) ? 'active' : ''}" onclick="addReaction('${msg.id}', '${emoji}')">${emoji} ${users.length}</button>`;
                }
            }
            reactionsHtml += '</div>';

            div.innerHTML = `
                <img class="msg-avatar" src="${iconUrl}">
                <div class="msg-body">
                    <div class="msg-header">
                        <span class="msg-author">${msg.user}</span>
                        <span class="msg-time">${msg.time}</span>
                        ${pinSpan}
                    </div>
                    ${replyHtml}
                    <div class="msg-text">${msg.text}</div>
                    ${mediaHtml}
                    ${reactionsHtml}
                </div>
                <div class="msg-actions">
                    <button onclick="setReply('${msg.id}', '${msg.user}', '${msg.text}')">返信</button>
                    <button onclick="addReaction('${msg.id}', '👍')">👍</button>
                    <button onclick="togglePin('${msg.id}')">📌</button>
                    ${(msg.user === currentUser.username || currentUser.isAdmin) ? `
                        <button onclick="editMessage('${msg.id}')">編集</button>
                        <button onclick="deleteMessage('${msg.id}')" style="color:red;">削除</button>
                    ` : ''}
                </div>
            `;
            container.appendChild(div);
        }

        function sendMessage() {
            const text = document.getElementById('msg-input').value.trim();
            if (!text && !selectedFileBase64) return;

            socket.emit('chat_message', {
                room: currentRoom,
                user: currentUser.username,
                text: text,
                media: selectedFileBase64,
                mediaType: selectedFileType,
                replyTo: activeReplyTo
            });

            document.getElementById('msg-input').value = '';
            selectedFileBase64 = null;
            selectedFileType = null;
            document.getElementById('selected-file-name').innerText = '';
            cancelReply();
        }

        // --- メディア選択 ---
        function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;

            document.getElementById('selected-file-name').innerText = file.name;
            selectedFileType = file.type.startsWith('image/') ? 'image' : 'video';

            const reader = new FileReader();
            reader.onload = (e) => { selectedFileBase64 = e.target.result; };
            reader.readAsDataURL(file);
        }

        // --- 返信・編集・削除・ピン留め ---
        function setReply(id, user, text) {
            activeReplyTo = { id, user, text };
            document.getElementById('reply-preview-text').innerText = `返信先 @${user}: ${text}`;
            document.getElementById('reply-bar').style.display = 'flex';
        }

        function cancelReply() {
            activeReplyTo = null;
            document.getElementById('reply-bar').style.display = 'none';
        }

        function editMessage(msgId) {
            const newText = prompt('新しいメッセージを入力してください:');
            if (newText) socket.emit('edit_message', { room: currentRoom, msgId, newText });
        }

        function deleteMessage(msgId) {
            if (confirm('メッセージを削除しますか？')) socket.emit('delete_message', { room: currentRoom, msgId });
        }

        function togglePin(msgId) {
            socket.emit('toggle_pin', { room: currentRoom, msgId });
        }

        function addReaction(msgId, emoji) {
            socket.emit('add_reaction', { room: currentRoom, msgId, emoji, username: currentUser.username });
        }

        socket.on('message_edited', ({ msgId, newText }) => {
            const el = document.querySelector(`#msg-${msgId} .msg-text`);
            if (el) el.innerText = newText;
        });

        socket.on('message_deleted', (msgId) => {
            const el = document.getElementById(`msg-${msgId}`);
            if (el) el.remove();
        });

        socket.on('pin_toggled', () => joinRoom(currentRoom));
        socket.on('update_reactions', () => joinRoom(currentRoom));

        // --- チャンネル・ジャンル更新 ---
        socket.on('update_genres', (genres) => {
            genresData = genres;
            renderChannelsAndGenres();
        });

        socket.on('update_channels', (channels) => {
            channelsData = channels;
            renderChannelsAndGenres();
        });

        function renderChannelsAndGenres() {
            const container = document.getElementById('genres-container');
            container.innerHTML = '';

            // 権限チェック
            if (currentUser && (currentUser.isAdmin || (currentUser.customPermissions && currentUser.customPermissions.canManageGenres))) {
                document.getElementById('btn-manage-genres').style.display = 'inline-block';
            }

            genresData.forEach(genre => {
                const genreDiv = document.createElement('div');
                genreDiv.className = 'genre-title';
                genreDiv.innerText = genre.name;
                container.appendChild(genreDiv);

                const matchedChannels = channelsData.filter(c => c.genre === genre.name);
                matchedChannels.forEach(ch => {
                    const chDiv = document.createElement('div');
                    chDiv.className = `channel-item ${ch.name === currentRoom ? 'active' : ''}`;
                    chDiv.innerText = `${ch.isKey ? '🔒 ' : '# '}${ch.name}`;
                    chDiv.onclick = () => {
                        if (ch.isKey && ch.creator !== currentUser.username && !currentUser.isAdmin && !ch.allowedUsers.includes(currentUser.username)) {
                            const pass = prompt('鍵部屋のパスワードを入力してください:');
                            joinRoom(ch.name, pass);
                        } else {
                            joinRoom(ch.name);
                        }
                    };
                    container.appendChild(chDiv);
                });
            });
        }

        // --- DM未読カウント＆ユーザー一覧 ---
        socket.on('update_user_list', (users) => {
            const container = document.getElementById('user-list-container');
            container.innerHTML = '';
            users.forEach(u => {
                if (u.username === currentUser.username) return;
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerText = `@ ${u.username}`;
                div.onclick = () => openUserViewModal(u);
                container.appendChild(div);
            });
        });

        socket.on('update_dm_unreads', (unreads) => {
            unreadCounts = unreads;
            renderDmList();
        });

        socket.on('update_dm_unread_single', ({ targetUsername, count }) => {
            unreadCounts[targetUsername] = count;
            renderDmList();
        });

        function renderDmList() {
            const container = document.getElementById('dm-list-container');
            container.innerHTML = '';
            for (const [targetUser, count] of Object.entries(unreadCounts)) {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `<span>@ ${targetUser}</span> ${count > 0 ? `<span class="badge">${count}</span>` : ''}`;
                div.onclick = () => {
                    const pairKey = [currentUser.username, targetUser].sort().join('_');
                    joinRoom(`dm_${pairKey}`);
                };
                container.appendChild(div);
            }
        }

        // --- DM開始（プロフィールから明示的に開始） ---
        function startDmWithUser() {
            if (!activeTargetUser) return;
            socket.emit('start_dm', { targetUsername: activeTargetUser.username });
        }

        socket.on('dm_started', ({ targetUsername, roomId }) => {
            closeModal('modal-user-view');
            unreadCounts[targetUsername] = unreadCounts[targetUsername] || 0;
            renderDmList();
            joinRoom(roomId);
        });

        // --- モーダル・プロフィールの制御 ---
        function openProfileModal() {
            document.getElementById('prof-icon').value = currentUser.icon || '';
            document.getElementById('prof-status').value = currentUser.status || '';
            document.getElementById('prof-bio').value = currentUser.bio || '';
            document.getElementById('prof-notifications').checked = currentUser.notificationsEnabled !== false;
            document.getElementById('modal-profile').style.display = 'flex';
        }

        function saveProfile() {
            const icon = document.getElementById('prof-icon').value;
            const status = document.getElementById('prof-status').value;
            const bio = document.getElementById('prof-bio').value;
            const notificationsEnabled = document.getElementById('prof-notifications').checked;

            socket.emit('update_profile', {
                username: currentUser.username,
                icon, status, bio, notificationsEnabled,
                channelNotifications: currentUser.channelNotifications || {}
            });
        }

        socket.on('profile_updated', (updatedUser) => {
            currentUser = updatedUser;
            closeModal('modal-profile');
            alert('プロフィールを保存しました。');
        });

        function openUserViewModal(user) {
            activeTargetUser = user;
            document.getElementById('view-username').innerText = user.username;
            document.getElementById('view-icon').src = user.icon || 'https://via.placeholder.com/60';
            document.getElementById('view-status').innerText = user.status ? `ステータス: ${user.status}` : '';
            document.getElementById('view-bio').innerText = user.bio || '自己紹介はありません。';

            if (currentUser.isAdmin) {
                document.getElementById('admin-user-actions').style.display = 'block';
            } else {
                document.getElementById('admin-user-actions').style.display = 'none';
            }

            document.getElementById('modal-user-view').style.display = 'flex';
        }

        // --- 管理者機能 ---
        function toggleIpBan() {
            if (activeTargetUser) socket.emit('admin_toggle_ip_ban', activeTargetUser.username);
        }

        function grantGenrePermission() {
            if (activeTargetUser) {
                socket.emit('admin_grant_permission', {
                    targetUsername: activeTargetUser.username,
                    permissionKey: 'canManageGenres',
                    value: true
                });
                alert(`${activeTargetUser.username} にジャンル管理権限を付与しました。`);
            }
        }

        function fetchAdminPasswords() {
            socket.emit('admin_get_passwords');
        }

        socket.on('admin_passwords_list', (list) => {
            let str = '【ユーザーパスワード一覧】\n';
            list.forEach(u => str += `${u.username}: ${u.password}\n`);
            alert(str);
        });

        function fetchAdminDms() {
            socket.emit('admin_get_all_dms');
        }

        socket.on('admin_all_dms_list', (dms) => {
            console.log('全DMメッセージ:', dms);
            alert(`全DMメッセージ (${dms.length}件) をコンソールログに出力しました。F12で確認してください。`);
        });

        // --- チャンネル作成 ＆ 鍵部屋 ---
        function openCreateChannelModal() {
            const select = document.getElementById('new-channel-genre');
            select.innerHTML = '';
            genresData.forEach(g => {
                select.innerHTML += `<option value="${g.name}">${g.name}</option>`;
            });
            document.getElementById('modal-create-channel').style.display = 'flex';
        }

        function toggleKeyPasswordInput(cb) {
            document.getElementById('new-channel-pass').style.display = cb.checked ? 'block' : 'none';
        }

        function createChannel() {
            const name = document.getElementById('new-channel-name').value.trim();
            const genre = document.getElementById('new-channel-genre').value;
            const isKey = document.getElementById('new-channel-key').checked;
            const password = document.getElementById('new-channel-pass').value.trim();

            if (!name) return alert('チャンネル名を入力してください');

            socket.emit('create_channel', { name, genre, isKey, password, creator: currentUser.username });
            closeModal('modal-create-channel');
        }

        function openKeyRoomManageModal() {
            document.getElementById('modal-key-room-manage').style.display = 'flex';
        }

        function manageKeyRoomUser(action) {
            const targetUser = document.getElementById('target-key-user').value.trim();
            if (!targetUser) return;
            socket.emit('manage_key_room_user', { roomName: currentRoom, targetUser, action });
            document.getElementById('target-key-user').value = '';
            closeModal('modal-key-room-manage');
        }

        // --- ジャンル管理 ---
        function openGenreManageModal() {
            renderGenreEditList();
            document.getElementById('modal-genre-manage').style.display = 'flex';
        }

        function renderGenreEditList() {
            const container = document.getElementById('genre-edit-list');
            container.innerHTML = '';
            genresData.forEach((g, idx) => {
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.gap = '6px';
                div.style.marginBottom = '6px';
                div.innerHTML = `
                    <input type="text" value="${g.name}" id="genre-name-${idx}">
                    <button onclick="renameGenre('${g.name}', ${idx})" style="font-size:10px;">名変</button>
                    <button onclick="deleteGenre('${g.name}')" style="background:#dc3545; font-size:10px;">削除</button>
                `;
                container.appendChild(div);
            });
        }

        function addGenre() {
            const name = document.getElementById('new-genre-input').value.trim();
            if (name) socket.emit('manage_genres', { action: 'add', genreName: name });
        }

        function renameGenre(oldName, idx) {
            const newName = document.getElementById(`genre-name-${idx}`).value.trim();
            if (newName) socket.emit('manage_genres', { action: 'rename', genreName: oldName, newName });
        }

        function deleteGenre(name) {
            if (confirm(`ジャンル「${name}」を削除しますか？`)) {
                socket.emit('manage_genres', { action: 'delete', genreName: name });
            }
        }

        // --- チャンネル別通知設定 ---
        function toggleChannelNotification() {
            if (!currentUser.channelNotifications) currentUser.channelNotifications = {};
            const currentState = currentUser.channelNotifications[currentRoom] !== false;
            currentUser.channelNotifications[currentRoom] = !currentState;

            socket.emit('update_profile', {
                username: currentUser.username,
                icon: currentUser.icon,
                status: currentUser.status,
                bio: currentUser.bio,
                notificationsEnabled: currentUser.notificationsEnabled,
                channelNotifications: currentUser.channelNotifications
            });

            updateNotificationButtonState();
        }

        function updateNotificationButtonState() {
            const btn = document.getElementById('btn-channel-notif');
            const globalOn = currentUser ? currentUser.notificationsEnabled !== false : true;
            const channelOn = (currentUser && currentUser.channelNotifications) ? currentUser.channelNotifications[currentRoom] !== false : true;

            if (!globalOn) {
                btn.innerText = '通知: 全体OFF';
                btn.style.background = '#dc3545';
                btn.style.color = 'white';
            } else if (!channelOn) {
                btn.innerText = '通知: 部屋OFF';
                btn.style.background = '#ffc107';
                btn.style.color = 'black';
            } else {
                btn.innerText = '通知: ON';
                btn.style.background = '#28a745';
                btn.style.color = 'white';
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>
</body>
</html>
